name: Verify HW12 jitter analysis

on:
  push:
    paths:
      - 'homework/hw12/**'
      - '.github/workflows/verify-hw12.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'homework/hw12/**'
      - '.github/workflows/verify-hw12.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hw12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python homework/hw12/verify_inputs.py
      - run: python -m unittest discover -s homework/hw12/tests -v
      - run: python homework/hw12/tests/verify_results.py
      - name: Small reproducibility smoke run
        run: python homework/hw12/src/hw12.py --bits 4096 --output /tmp/hw12-smoke
