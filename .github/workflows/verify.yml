name: Verify coursework

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python homework/hw03/verify_inputs.py --quick
      - run: python homework/hw08/verify_inputs.py
      - run: python homework/hw01/analyze.py --output /tmp/hw01-results
      - run: python -m unittest discover -s homework/hw06/tests -v
      - run: python homework/hw06/tests/verify_results.py
      - run: python homework/hw07/tests/verify_reference.py
      - run: python homework/hw07/src/hw7.py --output /tmp/hw07-results
      - run: python homework/hw08/analyze.py --bits 4096 --output /tmp/hw08-results
